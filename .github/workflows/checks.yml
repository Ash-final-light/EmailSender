name: Checks
on:
  push:
    paths:
      - '**.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'job_radar/**/*.py'
      - 'job_radar/config.json'
      - 'job_radar/requirements.txt'
  pull_request:
    paths:
      - '**.py'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'job_radar/**/*.py'
      - 'job_radar/config.json'
      - 'job_radar/requirements.txt'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r job_radar/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s job_radar/tests -v
