name: Unity Internship Radar
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first. Send submits one real report. Resume requires your confirmation.'
        required: true
        default: preview
        type: choice
        options: [preview, send, collect, preview-seeds, preview-cached, resume, confirm-delivered, release-delivery]
      weekly_token_limit:
        description: 'Optional new weekly token limit; accepted only with resume; used counts are retained.'
        required: false
        default: ''
        type: string
  schedule:
    # Asia/Shanghai daily 08:30; Tuesday/Friday 09:00.
    - cron: '30 0 * * *'
    - cron: '0 1 * * 2,5'
permissions:
  contents: write
concurrency:
  group: news-state
  cancel-in-progress: false
jobs:
  radar:
    if: github.event_name != 'schedule' || vars.JOBS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
      JOB_RADAR_CHECKPOINT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            job_radar/requirements.txt
      - run: pip install -r job_radar/requirements.txt
      - name: Run job radar
        env:
          RADAR_MODE: ${{ inputs.mode }}
          RADAR_EVENT: ${{ github.event_name }}
          RADAR_CRON: ${{ github.event.schedule }}
          WEEKLY_TOKEN_LIMIT: ${{ inputs.weekly_token_limit }}
        shell: bash
        run: |
          mode="$RADAR_MODE"
          if [[ "$RADAR_EVENT" == "schedule" ]]; then
            if [[ "$RADAR_CRON" == '30 0 * * *' ]]; then mode=collect; else mode=send; fi
          fi
          args=()
          if [[ -n "$WEEKLY_TOKEN_LIMIT" ]]; then args+=(--weekly-token-limit "$WEEKLY_TOKEN_LIMIT"); fi
          python -m job_radar.app "$mode" "${args[@]}"
      - name: Persist job state even on failure
        if: always()
        run: bash scripts/persist-job-state.sh
      - name: Save job preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-internship-preview
          path: |
            artifacts/jobs-preview.html
            artifacts/jobs-preview.json
            job_radar/data/sources.json
          if-no-files-found: warn
          retention-days: 14
