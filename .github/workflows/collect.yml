name: Collect News
on:
  workflow_dispatch:
  schedule:
    # UTC 00:00 / 12:00 = Asia/Shanghai 08:00 / 20:00.
    - cron: '0 0,12 * * *'
permissions:
  contents: write
concurrency:
  group: news-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py --collect-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist candidates and source status
        if: always()
        run: bash scripts/persist-state.sh
